name: Build & deploy website

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID || 'xsttrmdn' }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
          PUBLIC_SANITY_SAMPLE: ${{ vars.PUBLIC_SANITY_SAMPLE || '0' }}
        run: |
          npm ci
          npm run build
          echo "adarshkrishnan.com" > build/CNAME

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
